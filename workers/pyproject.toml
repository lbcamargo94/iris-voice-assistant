[project]
name = "iris-workers"
version = "0.1.0"
description = "Local AI workers (STT, translation, LLM adapter, TTS) for Iris Voice Assistant"
requires-python = "==3.12.*"
# AI dependencies (faster-whisper, ctranslate2, piper, ...) are added and pinned during POC-001A,
# each justified per AGENTS.md (function, license, maintenance, distribution impact; docs/LICENSES.md).
dependencies = [
    "numpy>=2.0,<3",  # audio buffers (BSD-3-Clause)
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]
# AI runtime of the production workers (speech, translation; POC-001D). Not installed by default or in CI
# (~1.3 GB of CUDA libraries): `uv sync --group ai`. Justification in docs/LICENSES.md.
ai = [
    "faster-whisper>=1.1,<2",        # STT (MIT) on CTranslate2 (MIT)
    "nvidia-cublas-cu12>=12.4,<13",  # CUDA 12 cuBLAS DLLs for CTranslate2 (NVIDIA EULA)
    "nvidia-cudnn-cu12>=9.1,<10",    # cuDNN 9 DLLs for CTranslate2 (NVIDIA EULA)
    "sentencepiece>=0.2,<0.3",       # Opus-MT/Argos tokenization (Apache-2.0)
]
# POC-001A benchmarks: the AI runtime plus resource sampling.
bench = [
    { include-group = "ai" },
    "psutil>=6.0,<8",                # CPU/RAM sampling (BSD-3-Clause)
    "nvidia-ml-py>=12.0",            # VRAM sampling via NVML (BSD-3-Clause)
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_workers"]

[tool.uv]
# P0 targets Windows x64; resolve only versions that ship win_amd64 wheels.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
